# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      # Download and uncompress the binary
      # https://git-lfs.github.com/
      - wget https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-amd64-v3.7.1.tar.gz
      - tar xvfz git-lfs-linux-amd64-v3.7.1.tar.gz git-lfs-3.7.1/git-lfs
      # Modify LFS config paths to point where git-lfs binary was downloaded
      - git config filter.lfs.process "`pwd`/git-lfs-3.7.1/git-lfs filter-process"
      - git config filter.lfs.smudge  "`pwd`/git-lfs-3.7.1/git-lfs smudge -- %f"
      - git config filter.lfs.clean "`pwd`/git-lfs-3.7.1/git-lfs clean -- %f"
      # Make LFS available in current repository
      - ./git-lfs-3.7.1/git-lfs install
      # Download content from remote (continue even if some objects are missing)
      - ./git-lfs-3.7.1/git-lfs fetch || echo "Some LFS objects not available"
      # Make local files to have the real content on them
      - ./git-lfs-3.7.1/git-lfs checkout || echo "Some LFS files not checked out"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
